name: AIR-TCBOOT

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.upstream-sha'
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean
      UPSTREAM_SHA:
        description: '由 Check-Upstream 传入，勿手动填写。'
        required: false
        type: string

permissions:
  contents: write        # 收尾 job 需要 push .upstream-sha

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [AIROHA-TCBOOT]
        SOURCE: [bingoguo93/immortalwrt]
        BRANCH: [6.18]
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}

  #仅当编译成功、且由 Check-Upstream 派发时，才记录上游 SHA
  record_sha:
    name: 记录上游 SHA
    needs: config
    if: inputs.UPSTREAM_SHA != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 保存 SHA
        env:
          UPSTREAM_SHA: ${{ inputs.UPSTREAM_SHA }}
        run: |
          echo "$UPSTREAM_SHA" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha
          git diff --cached --quiet && exit 0
          git commit -m "chore: 编译成功，记录上游 SHA $UPSTREAM_SHA"
          git push
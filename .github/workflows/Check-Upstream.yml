name: Check-Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # ← 关键：必须有这行

env:
  UPSTREAM_REPO: https://github.com/bingoguo93/immortalwrt.git
  UPSTREAM_BRANCH: 6.18
  SHA_FILE: .upstream-sha

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查上游是否有新提交
        id: check
        run: |
          HEAD_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          LAST_SHA=$(cat "$SHA_FILE" 2>/dev/null || echo "none")
          echo "上游当前: $HEAD_SHA"
          echo "上次记录: $LAST_SHA"
          if [ "$HEAD_SHA" != "$LAST_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$HEAD_SHA" > "$SHA_FILE"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 保存 SHA 记录
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SHA_FILE"
          git commit -m "chore: 上游源码有更新，同步 SHA"
          git push

      - name: 触发编译
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'AIR-TCBOOT.yml',
              ref: 'main',                 // ← 改成你的默认分支
              inputs: { TEST: 'false' },
              headers: {                   // 可选：消除版本弃用警告
                'x-github-api-version': '2022-11-28'
              }
            });
# SPDX-License-Identifier: MIT

name: Check-Upstream

on:
  # 每 6 小时轮询一次上游（UTC 时间）
  schedule:
    - cron: "0 */6 * * *"
  # 手动检查
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查上游是否有新提交
        id: check
        run: |
          # ===== 按你的实际情况修改这两项 =====
          UPSTREAM_REPO="https://github.com/bingoguo93/immortalwrt.git"
          UPSTREAM_BRANCH="6.18"
          # ====================================

          HEAD_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          LAST_SHA=$(cat .upstream-sha 2>/dev/null || echo "none")

          echo "上游当前: $HEAD_SHA"
          echo "上次记录: $LAST_SHA"

          if [ "$HEAD_SHA" != "$LAST_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$HEAD_SHA" > .upstream-sha
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无更新，跳过编译"
          fi

      - name: 保存记录并派发编译
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // 记录新 SHA
            const fs = require('fs');
            const sha = fs.readFileSync('.upstream-sha', 'utf8').trim();

            // 提交 .upstream-sha
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.ref.replace('refs/heads/', '')}`,
            });
            const { data: blob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: sha + '\n',
              encoding: 'utf-8',
            });
            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: ref.object.sha,
              tree: [{ path: '.upstream-sha', mode: '100644', type: 'blob', sha: blob.sha }],
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `chore: 上游更新至 ${sha.slice(0, 7)}`,
              tree: tree.sha,
              parents: [ref.object.sha],
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.ref.replace('refs/heads/', '')}`,
              sha: commit.sha,
            });

            // 派发编译任务
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'AIR-TCBOOT.yml',
              ref: context.ref.replace('refs/heads/', ''),
            });

            console.log(`已派发编译，上游新 SHA: ${sha}`);
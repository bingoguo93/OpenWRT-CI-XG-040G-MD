name: Check-Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write          # 只派发任务，不需要 contents 了

env:
  UPSTREAM_REPO: https://github.com/bingoguo93/immortalwrt.git
  UPSTREAM_BRANCH: 6.18
  SHA_FILE: .upstream-sha

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查上游是否有新提交
        id: check
        run: |
          HEAD_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          LAST_SHA=$(cat "$SHA_FILE" 2>/dev/null || echo "none")
          echo "上游当前: $HEAD_SHA"
          echo "上次记录: $LAST_SHA"
          if [ "$HEAD_SHA" != "$LAST_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 触发编译（编译成功后由 AIR-TCBOOT 记录 SHA）
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.sha }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'AIR-TCBOOT.yml',
              ref: 'main',
              inputs: {
                TEST: 'false',
                UPSTREAM_SHA: process.env.UPSTREAM_SHA
              }
            });

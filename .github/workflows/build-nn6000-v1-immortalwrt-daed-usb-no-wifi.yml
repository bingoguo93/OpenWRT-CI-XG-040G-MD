name: Build NN6000 v1 ImmortalWrt Daed USB No WiFi

"on":
  workflow_dispatch:
    inputs:
      source_branch:
        description: "ImmortalWrt branch"
        required: true
        default: "master"
      lan_ip:
        description: "Default LAN IP"
        required: true
        default: "192.168.1.1"
      lucky_core_version:
        description: "Lucky core version to build"
        required: true
        default: "2.27.2"
      device_keyword:
        description: "Device keyword used to auto-detect profile"
        required: true
        default: "nn6000"

env:
  REPO_URL: "https://github.com/immortalwrt/immortalwrt.git"
  REPO_DIR: "openwrt"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker rmi $(docker images -q) 2>/dev/null || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz msmtp nano ninja-build \
            nodejs npm p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-setuptools libpython3-dev qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev file time dos2unix zstd re2c libyaml-dev libz-dev \
            libgnutls28-dev lld mkisofs python3-ply python3-docutils \
            python3-pyelftools ecj
          sudo npm install -g pnpm

      - name: Clone ImmortalWrt source
        shell: bash
        run: |
          set -euxo pipefail

          BRANCH="${{ inputs.source_branch }}"
          [ -n "$BRANCH" ] || BRANCH="master"

          git clone --depth=1 --single-branch -b "$BRANCH" "$REPO_URL" "$REPO_DIR"

      - name: Resolve NN6000 v1 device profile
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          KEYWORD="${{ inputs.device_keyword }}"
          [ -n "$KEYWORD" ] || KEYWORD="nn6000"

          echo "Searching device profile by keyword: $KEYWORD"

          MATCHES="$(grep -RInE "define Device/.*${KEYWORD}|DEVICE_MODEL.*${KEYWORD}|DEVICE_ALT.*${KEYWORD}" \
            target/linux/*/image target/linux/*/dts 2>/dev/null || true)"

          if [ -z "$MATCHES" ]; then
            echo "ERROR: Cannot find NN6000 profile in this ImmortalWrt branch."
            echo "Available nearby device definitions:"
            grep -RInE "define Device/|DEVICE_MODEL" target/linux/*/image 2>/dev/null | \
              grep -Ei "nokia|nn|6000|filogic|mediatek|mt798|qualcommax|ipq" || true
            exit 1
          fi

          echo "$MATCHES"

          IMAGE_LINE="$(grep -RInE "define Device/.*${KEYWORD}" target/linux/*/image/*.mk target/linux/*/image/*/*.mk 2>/dev/null | head -n1 || true)"

          if [ -z "$IMAGE_LINE" ]; then
            CANDIDATE_FILE="$(echo "$MATCHES" | awk -F: '/target\/linux\/.*\/image\// {print $1; exit}')"
            if [ -n "$CANDIDATE_FILE" ]; then
              IMAGE_LINE="$(grep -nE "define Device/" "$CANDIDATE_FILE" | head -n1 | sed "s#^#${CANDIDATE_FILE}:#")"
            fi
          fi

          if [ -z "$IMAGE_LINE" ]; then
            echo "ERROR: Found keyword, but cannot resolve OpenWrt Device profile."
            exit 1
          fi

          IMAGE_FILE="$(echo "$IMAGE_LINE" | cut -d: -f1)"
          DEVICE_ID="$(echo "$IMAGE_LINE" | sed -n 's/.*define Device\/\([^[:space:]]*\).*/\1/p')"

          TARGET="$(echo "$IMAGE_FILE" | awk -F/ '{print $3}')"
          SUBTARGET="$(basename "$IMAGE_FILE" .mk)"

          if [ -z "$TARGET" ] || [ -z "$SUBTARGET" ] || [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Failed to parse target/subtarget/device from: $IMAGE_LINE"
            exit 1
          fi

          {
            echo "TARGET=$TARGET"
            echo "SUBTARGET=$SUBTARGET"
            echo "DEVICE_ID=$DEVICE_ID"
          } | tee ../nn6000-target.env

          echo "Resolved NN6000 target:"
          echo "  target=$TARGET"
          echo "  subtarget=$SUBTARGET"
          echo "  device=$DEVICE_ID"

      - name: Patch NN6000 device packages to remove WiFi defaults
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          . ../nn6000-target.env

          export TARGET
          export SUBTARGET
          export DEVICE_ID

          IMAGE_FILE="target/linux/${TARGET}/image/${SUBTARGET}.mk"

          if [ ! -f "$IMAGE_FILE" ]; then
            echo "ERROR: image file not found: $IMAGE_FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          target = os.environ["TARGET"]
          subtarget = os.environ["SUBTARGET"]
          device_id = os.environ["DEVICE_ID"]

          p = Path(f"target/linux/{target}/image/{subtarget}.mk")
          s = p.read_text()

          start_pat = f"define Device/{device_id}"
          start = s.find(start_pat)
          if start < 0:
              raise SystemExit(f"Cannot find {start_pat} in {p}")

          end = s.find("\nendef", start)
          if end < 0:
              raise SystemExit(f"Cannot find endef for {start_pat}")

          block = s[start:end]

          remove_pkgs = [
              "ath11k-firmware-ipq6018",
              "ath11k-firmware-ipq8074",
              "ath11k-firmware-qcn9074",
              "ath11k-firmware-qcn9074-ahb",
              "ath11k-firmware-qcn9074-pci",
              "ath12k-firmware-ipq5332",
              "ath12k-firmware-qcn9274",
              "kmod-ath",
              "kmod-ath10k",
              "kmod-ath11k",
              "kmod-ath12k",
              "kmod-cfg80211",
              "kmod-mac80211",
              "wpad",
              "wpad-basic",
              "wpad-basic-mbedtls",
              "wpad-basic-openssl",
              "wpad-basic-wolfssl",
              "hostapd",
              "hostapd-common",
              "iw",
              "iwinfo",
              "wireless-regdb",
          ]

          extra = " ".join(f"-{pkg}" for pkg in remove_pkgs)

          if "NN6000_NO_WIFI_DEVICE_PACKAGES" not in block:
              block = block.rstrip() + f"\n  # NN6000_NO_WIFI_DEVICE_PACKAGES\n  DEVICE_PACKAGES += {extra}\n"

          s = s[:start] + block + s[end:]
          p.write_text(s)

          print(f"Patched {p}")
          PY

          echo "===== Patched NN6000 device definition ====="
          awk "/define Device\\/${DEVICE_ID}/,/endef/" "$IMAGE_FILE"

      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix elfutils host build flags
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          for d in tools/elfutils package/libs/elfutils; do
            [ -d "$d" ] || continue

            rm -f "$d/patches/010-fix-xasprintf-format-security.patch" || true
            rm -f "$d/patches/011-elfutils-gcc15-register-array.patch" || true

            [ -f "$d/Makefile" ] || continue

            python3 - "$d/Makefile" <<'PYMAKE'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "# NN6000_ELFUTILS_SAFE_FLAGS"

          block = """
          # NN6000_ELFUTILS_SAFE_FLAGS
          HOST_CONFIGURE_ARGS += --enable-maintainer-mode
          CONFIGURE_ARGS += --enable-maintainer-mode
          HOST_CFLAGS += -Wno-error -Wno-format-security -Wno-error=format-security
          TARGET_CFLAGS += -Wno-error -Wno-format-security -Wno-error=format-security
          EXTRA_CFLAGS += -Wno-error -Wno-format-security -Wno-error=format-security
          """.lstrip()

          if marker not in s:
              positions = [
                  x for x in [
                      s.find("$(eval $(call HostBuild"),
                      s.find("$(eval $(call BuildPackage")
                  ] if x != -1
              ]

              if positions:
                  i = min(positions)
                  s = s[:i] + "\n" + block + "\n" + s[i:]
              else:
                  s += "\n" + block

          p.write_text(s)
          PYMAKE
          done

          grep -R "NN6000_ELFUTILS_SAFE_FLAGS" -n tools/elfutils package/libs/elfutils || true

      - name: Add custom packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package/lucky
          rm -rf package/luci-app-gecoosac
          rm -rf package/luci-theme-aurora
          rm -rf package/luci-app-aurora-config
          rm -rf package/dae

          git clone --depth=1 "https://github.com/gdy666/luci-app-lucky.git" package/lucky

          LUCKY_CORE_VERSION="${{ inputs.lucky_core_version }}"
          [ -n "$LUCKY_CORE_VERSION" ] || LUCKY_CORE_VERSION="2.27.2"
          LUCKY_ASSET_URL="https://github.com/gdy666/lucky/releases/download/v${LUCKY_CORE_VERSION}/lucky_${LUCKY_CORE_VERSION}_Linux_arm64.tar.gz"

          if ! curl -fsIL --retry 3 --retry-delay 2 "$LUCKY_ASSET_URL" >/dev/null; then
            echo "Lucky asset not found: $LUCKY_ASSET_URL"
            echo "Fallback to Lucky 2.27.2."
            LUCKY_CORE_VERSION="2.27.2"
          fi

          if [ -f package/lucky/lucky/Makefile ]; then
            LUCKY_CORE_VERSION="$LUCKY_CORE_VERSION" perl -0pi -e 's/PKG_VERSION:=[^ \n\r]+/PKG_VERSION:=$ENV{LUCKY_CORE_VERSION}/g' package/lucky/lucky/Makefile
            perl -0pi -e 's/PKG_RELEASE:=[^ \n\r]+/PKG_RELEASE:=1/g' package/lucky/lucky/Makefile
            grep -oE "PKG_NAME:=lucky|PKG_VERSION:=[^ ]+|PKG_HASH:=[^ ]+" package/lucky/lucky/Makefile || true
          fi

          git clone --depth=1 "https://github.com/laipeng668/luci-app-gecoosac.git" package/luci-app-gecoosac
          git clone --depth=1 "https://github.com/eamonxg/luci-theme-aurora.git" package/luci-theme-aurora
          git clone --depth=1 "https://github.com/eamonxg/luci-app-aurora-config.git" package/luci-app-aurora-config

          git clone --depth=1 -b kix "https://github.com/QiuSimons/luci-app-daed.git" package/dae || \
          git clone --depth=1 "https://github.com/QiuSimons/luci-app-daed.git" package/dae

      - name: Create default first-boot settings
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-nn6000-defaults <<'EOF'
          #!/bin/sh

          LAN_IP="__LAN_IP__"

          uci -q batch <<EOT
          set luci.main.lang='zh_cn'
          set luci.main.mediaurlbase='/luci-static/aurora'
          set luci.languages.zh_cn='简体中文'
          set luci.languages.en='English'
          commit luci
          EOT

          uci -q batch <<EOT
          set network.lan.proto='static'
          set network.lan.ipaddr='$LAN_IP'
          set network.lan.netmask='255.255.255.0'
          set network.lan.ip6assign='60'
          commit network
          EOT

          rm -f /etc/config/wireless
          [ -x /sbin/wifi ] && wifi down || true

          uci -q batch <<EOT
          set firewall.@defaults[0].flow_offloading='0'
          set firewall.@defaults[0].flow_offloading_hw='0'
          commit firewall
          set network.globals='globals'
          set network.globals.packet_steering='1'
          commit network
          EOT

          [ -x /etc/init.d/irqbalance ] && /etc/init.d/irqbalance enable
          [ -x /etc/init.d/zram ] && /etc/init.d/zram enable
          [ -x /etc/init.d/daed ] && /etc/init.d/daed disable
          [ -x /etc/init.d/lucky ] && /etc/init.d/lucky disable

          rm -rf /tmp/luci-indexcache /tmp/luci-modulecache

          exit 0
          EOF

          sed -i "s/__LAN_IP__/${{ inputs.lan_ip }}/g" files/etc/uci-defaults/99-nn6000-defaults
          chmod +x files/etc/uci-defaults/99-nn6000-defaults

      - name: Generate .config
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          . ../nn6000-target.env

          cat > .config <<EOF
          # NN6000 v1 ImmortalWrt + Daed + USB full + no WiFi
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_ID}=y

          # CONFIG_DEVEL is not set
          # CONFIG_KERNEL_DEBUG_INFO is not set
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          # CONFIG_KERNEL_DEBUG_INFO_BTF is not set
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          # CONFIG_BPF_TOOLCHAIN_HOST is not set
          CONFIG_KERNEL_XDP_SOCKETS=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          # CONFIG_DAED_USE_KERNEL_BTF is not set
          # CONFIG_DAED_USE_VMLINUX_BTF is not set

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_kmod-slhc=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_LUCI_LANG_zh_Hans=y
          # CONFIG_LUCI_LANG_zh_Hant is not set

          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y

          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y

          CONFIG_PACKAGE_dae=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_luci-i18n-daed-zh-cn=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_zoneinfo-asia=y

          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_luci-app-microsocks=y
          CONFIG_PACKAGE_luci-i18n-microsocks-zh-cn=y

          CONFIG_PACKAGE_gecoosac=y
          CONFIG_PACKAGE_luci-app-gecoosac=y

          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_kmod-zram=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-dwc3=y
          CONFIG_PACKAGE_kmod-usb-dwc3-qcom=y
          CONFIG_PACKAGE_kmod-usb-ehci=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ledtrig-usbport=y

          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-extras=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_mount-utils=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_lsblk=y

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_kmod-fs-autofs4=y
          CONFIG_PACKAGE_kmod-nls-base=y
          CONFIG_PACKAGE_kmod-nls-cp437=y

          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_ntfs3-mount=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y
          CONFIG_PACKAGE_kmod-mii=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-ch341=y
          CONFIG_PACKAGE_kmod-usb-serial-cp210x=y
          CONFIG_PACKAGE_kmod-usb-serial-ftdi=y
          CONFIG_PACKAGE_kmod-usb-serial-pl2303=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_usb-modeswitch=y

          CONFIG_PACKAGE_kmod-usb-printer=y
          CONFIG_PACKAGE_p910nd=y
          CONFIG_PACKAGE_luci-app-p910nd=y
          CONFIG_PACKAGE_kmod-hid=y
          CONFIG_PACKAGE_kmod-usb-hid=y
          CONFIG_PACKAGE_kmod-input-core=y
          CONFIG_PACKAGE_kmod-sound-core=y
          CONFIG_PACKAGE_kmod-usb-audio=y

          CONFIG_PACKAGE_uboot-envtools=y
          CONFIG_PACKAGE_ubi-utils=y

          # CONFIG_PACKAGE_wpad is not set
          # CONFIG_PACKAGE_wpad-basic is not set
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          # CONFIG_PACKAGE_wpad-basic-openssl is not set
          # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
          # CONFIG_PACKAGE_wpad-mbedtls is not set
          # CONFIG_PACKAGE_wpad-mesh-mbedtls is not set
          # CONFIG_PACKAGE_wpad-mesh-openssl is not set
          # CONFIG_PACKAGE_wpad-mesh-wolfssl is not set
          # CONFIG_PACKAGE_wpad-mini is not set
          # CONFIG_PACKAGE_wpad-openssl is not set
          # CONFIG_PACKAGE_wpad-wolfssl is not set
          # CONFIG_PACKAGE_hostapd is not set
          # CONFIG_PACKAGE_hostapd-basic is not set
          # CONFIG_PACKAGE_hostapd-basic-mbedtls is not set
          # CONFIG_PACKAGE_hostapd-basic-openssl is not set
          # CONFIG_PACKAGE_hostapd-basic-wolfssl is not set
          # CONFIG_PACKAGE_hostapd-common is not set
          # CONFIG_PACKAGE_hostapd-mbedtls is not set
          # CONFIG_PACKAGE_hostapd-mini is not set
          # CONFIG_PACKAGE_hostapd-openssl is not set
          # CONFIG_PACKAGE_hostapd-wolfssl is not set
          # CONFIG_PACKAGE_wireless-regdb is not set
          # CONFIG_PACKAGE_iw is not set
          # CONFIG_PACKAGE_iw-full is not set
          # CONFIG_PACKAGE_iwcap is not set
          # CONFIG_PACKAGE_iwinfo is not set
          # CONFIG_PACKAGE_rpcd-mod-iwinfo is not set
          # CONFIG_PACKAGE_luci-app-wireless is not set
          # CONFIG_PACKAGE_kmod-cfg80211 is not set
          # CONFIG_PACKAGE_kmod-mac80211 is not set
          # CONFIG_PACKAGE_kmod-ath is not set
          # CONFIG_PACKAGE_kmod-ath9k is not set
          # CONFIG_PACKAGE_kmod-ath10k is not set
          # CONFIG_PACKAGE_kmod-ath11k is not set
          # CONFIG_PACKAGE_kmod-ath12k is not set
          # CONFIG_PACKAGE_ath11k-firmware-ipq6018 is not set
          # CONFIG_PACKAGE_ath11k-firmware-ipq8074 is not set
          # CONFIG_PACKAGE_ath11k-firmware-qcn9074 is not set
          # CONFIG_PACKAGE_kmod-mt76 is not set
          # CONFIG_PACKAGE_kmod-mt76-core is not set
          # CONFIG_PACKAGE_kmod-mt76-connac is not set
          # CONFIG_PACKAGE_kmod-mt7915e is not set
          # CONFIG_PACKAGE_kmod-mt7996e is not set
          # CONFIG_PACKAGE_kmod-mt7996-firmware is not set
          # CONFIG_PACKAGE_kmod-mt7996-233-firmware is not set
          # CONFIG_PACKAGE_kmod-rtw88 is not set
          # CONFIG_PACKAGE_kmod-rtw89 is not set
          EOF

          make defconfig

          for sym in \
            PACKAGE_wpad PACKAGE_wpad-basic PACKAGE_wpad-basic-mbedtls PACKAGE_wpad-basic-openssl PACKAGE_wpad-basic-wolfssl \
            PACKAGE_wpad-mbedtls PACKAGE_wpad-mesh-mbedtls PACKAGE_wpad-mesh-openssl PACKAGE_wpad-mesh-wolfssl \
            PACKAGE_wpad-mini PACKAGE_wpad-openssl PACKAGE_wpad-wolfssl \
            PACKAGE_hostapd PACKAGE_hostapd-basic PACKAGE_hostapd-basic-mbedtls PACKAGE_hostapd-basic-openssl \
            PACKAGE_hostapd-basic-wolfssl PACKAGE_hostapd-common PACKAGE_hostapd-mbedtls PACKAGE_hostapd-mini \
            PACKAGE_hostapd-openssl PACKAGE_hostapd-wolfssl \
            PACKAGE_wireless-regdb PACKAGE_iw PACKAGE_iw-full PACKAGE_iwcap PACKAGE_iwinfo PACKAGE_rpcd-mod-iwinfo \
            PACKAGE_luci-app-wireless \
            PACKAGE_kmod-cfg80211 PACKAGE_kmod-mac80211 \
            PACKAGE_kmod-ath PACKAGE_kmod-ath9k PACKAGE_kmod-ath10k PACKAGE_kmod-ath11k PACKAGE_kmod-ath12k \
            PACKAGE_ath11k-firmware-ipq6018 PACKAGE_ath11k-firmware-ipq8074 PACKAGE_ath11k-firmware-qcn9074 \
            PACKAGE_kmod-mt76 PACKAGE_kmod-mt76-core PACKAGE_kmod-mt76-connac \
            PACKAGE_kmod-mt7915e PACKAGE_kmod-mt7996e PACKAGE_kmod-mt7996-firmware PACKAGE_kmod-mt7996-233-firmware \
            PACKAGE_kmod-rtw88 PACKAGE_kmod-rtw89
          do
            ./scripts/config --disable "$sym" || true
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(".config")
          s = p.read_text()

          disable = [
              "PACKAGE_wpad",
              "PACKAGE_wpad-basic",
              "PACKAGE_wpad-basic-mbedtls",
              "PACKAGE_wpad-basic-openssl",
              "PACKAGE_wpad-basic-wolfssl",
              "PACKAGE_wpad-mbedtls",
              "PACKAGE_wpad-mesh-mbedtls",
              "PACKAGE_wpad-mesh-openssl",
              "PACKAGE_wpad-mesh-wolfssl",
              "PACKAGE_wpad-mini",
              "PACKAGE_wpad-openssl",
              "PACKAGE_wpad-wolfssl",
              "PACKAGE_hostapd",
              "PACKAGE_hostapd-basic",
              "PACKAGE_hostapd-basic-mbedtls",
              "PACKAGE_hostapd-basic-openssl",
              "PACKAGE_hostapd-basic-wolfssl",
              "PACKAGE_hostapd-common",
              "PACKAGE_hostapd-mbedtls",
              "PACKAGE_hostapd-mini",
              "PACKAGE_hostapd-openssl",
              "PACKAGE_hostapd-wolfssl",
              "PACKAGE_wireless-regdb",
              "PACKAGE_iw",
              "PACKAGE_iw-full",
              "PACKAGE_iwcap",
              "PACKAGE_iwinfo",
              "PACKAGE_rpcd-mod-iwinfo",
              "PACKAGE_luci-app-wireless",
              "PACKAGE_kmod-cfg80211",
              "PACKAGE_kmod-mac80211",
              "PACKAGE_kmod-ath",
              "PACKAGE_kmod-ath9k",
              "PACKAGE_kmod-ath10k",
              "PACKAGE_kmod-ath11k",
              "PACKAGE_kmod-ath12k",
              "PACKAGE_ath11k-firmware-ipq6018",
              "PACKAGE_ath11k-firmware-ipq8074",
              "PACKAGE_ath11k-firmware-qcn9074",
              "PACKAGE_kmod-mt76",
              "PACKAGE_kmod-mt76-core",
              "PACKAGE_kmod-mt76-connac",
              "PACKAGE_kmod-mt7915e",
              "PACKAGE_kmod-mt7996e",
              "PACKAGE_kmod-mt7996-firmware",
              "PACKAGE_kmod-mt7996-233-firmware",
              "PACKAGE_kmod-rtw88",
              "PACKAGE_kmod-rtw89",
          ]

          for sym in disable:
              s = re.sub(rf"^CONFIG_{re.escape(sym)}=.*\n", "", s, flags=re.M)
              s = re.sub(rf"^# CONFIG_{re.escape(sym)} is not set\n", "", s, flags=re.M)
              s += f"# CONFIG_{sym} is not set\n"

          p.write_text(s)
          PY

          echo "===== Selected NN6000 target ====="
          grep -E "CONFIG_TARGET_${TARGET}|DEVICE_${DEVICE_ID}" .config || true

          echo "===== Check USB packages ====="
          grep -E "CONFIG_PACKAGE_kmod-usb|CONFIG_PACKAGE_kmod-fs-|CONFIG_PACKAGE_block-mount|CONFIG_PACKAGE_usb-modeswitch" .config || true

          echo "===== Check WiFi disabled ====="
          grep -E "CONFIG_PACKAGE_(wpad|hostapd|iw|iwinfo|rpcd-mod-iwinfo|wireless-regdb|kmod-cfg80211|kmod-mac80211|kmod-ath|ath11k|kmod-mt76|kmod-mt7915|kmod-mt7996|kmod-rtw)" .config || true

          echo "===== Check daed packages ====="
          grep -E "CONFIG_PACKAGE_dae|CONFIG_PACKAGE_daed|CONFIG_PACKAGE_luci-app-daed|CONFIG_DAED_USE_KERNEL_BTF|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_XDP_SOCKETS" .config || true

          grep -q "^CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_ID}=y" .config
          grep -q "^CONFIG_PACKAGE_kmod-usb-storage=y" .config
          grep -q "^CONFIG_PACKAGE_kmod-usb3=y" .config
          grep -q "^CONFIG_PACKAGE_luci-app-daed=y" .config

          if grep -qE "^CONFIG_PACKAGE_(wpad|hostapd|iw|iwinfo|rpcd-mod-iwinfo|wireless-regdb|kmod-cfg80211|kmod-mac80211|kmod-ath|ath11k|kmod-mt76|kmod-mt7915|kmod-mt7996|kmod-rtw)=y" .config; then
            echo "ERROR: WiFi packages are still selected."
            exit 1
          fi

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          make download -j"$(nproc)" || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../build-nn6000-v1.log || make -j1 V=s 2>&1 | tee -a ../build-nn6000-v1.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NN6000-v1-ImmortalWrt-Daed-USB-NoWiFi-build-log
          path: build-nn6000-v1.log
          if-no-files-found: ignore

      - name: Prepare artifacts
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          . ../nn6000-target.env

          TARGET_DIR="bin/targets/${TARGET}/${SUBTARGET}"

          mkdir -p ../artifact

          find "$TARGET_DIR" -maxdepth 1 -type f \
            \( -iname "*nn6000*" -o -iname "*${DEVICE_ID}*" -o -iname "*sysupgrade*" -o -iname "*factory*" -o -iname "*.itb" -o -iname "*.bin" -o -iname "*.img.gz" \) \
            -exec cp -vf {} ../artifact/ \; || true

          cp -vf "$TARGET_DIR/sha256sums" ../artifact/ 2>/dev/null || true

          echo "===== Firmware artifacts ====="
          find ../artifact -maxdepth 1 -type f -print

          if ! find ../artifact -maxdepth 1 -type f | grep -q .; then
            echo "ERROR: No firmware artifacts found."
            find bin/targets -type f | sort
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: NN6000-v1-ImmortalWrt-Daed-USB-NoWiFi
          path: artifact/*
